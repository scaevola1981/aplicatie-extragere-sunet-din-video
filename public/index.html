<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const savedScheme = localStorage.getItem("color-scheme");
      document.querySelector('meta[name="color-scheme"]').content = savedScheme ?? "light dark";
      if (savedScheme === "light" || savedScheme === "dark") {
        document.documentElement.dataset.theme = savedScheme;
      }
    } catch (_) {}
  </script>
  <meta name="theme-color" content="#ecf0f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161920" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YT2MP3">
  <title>YT2MP3 — Descarcă Muzică MP3 din YouTube</title>
  <link rel="manifest" href="./manifest.json?v=8">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css?v=8">
</head>
<body>
  <main class="app-container">
    <header class="top-header">
      <div class="brand-row">
        <img src="./icon.svg" alt="YT2MP3" class="brand-icon">
        <div>
          <h1 class="brand-title">YT2MP3</h1>
          <p class="brand-subtitle">YouTube Audio Extractor • MP3</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="themeToggleBtn" class="btn-icon" aria-label="Comută tema White / Dark">
          🌓 Temă
        </button>
      </div>
    </header>

    <!-- Card Cautare / Link + Setari -->
    <section class="card">
      <h2 class="section-label">Caută pe YouTube sau lipește un link</h2>
      <form id="searchForm">
        <div class="search-input-wrap">
          <input
            type="search"
            id="queryInput"
            placeholder="Ex: Coldplay Yellow sau https://youtu.be/..."
            autocomplete="off"
            enterkeyhint="search"
          >
        </div>

        <div class="btn-row">
          <button type="button" id="pasteBtn" class="btn btn-secondary">
            📋 Lipește Link
          </button>
          <button type="submit" id="submitBtn" class="btn btn-primary">
            🔍 Caută / Preia
          </button>
        </div>

        <fieldset class="quality-fieldset">
          <legend class="quality-legend">Calitate Audio MP3:</legend>
          <div class="quality-options">
            <label class="radio-label" for="q-best">
              <input type="radio" id="q-best" name="quality" value="0" checked>
              <span>Max (~256 kbps)</span>
            </label>
            <label class="radio-label" for="q-192">
              <input type="radio" id="q-192" name="quality" value="192K">
              <span>192 kbps</span>
            </label>
            <label class="radio-label" for="q-128">
              <input type="radio" id="q-128" name="quality" value="128K">
              <span>128 kbps</span>
            </label>
          </div>
        </fieldset>

        <div class="auto-dl-row">
          <label class="checkbox-label" for="autoDownloadCheck">
            <input type="checkbox" id="autoDownloadCheck" class="visually-hidden">
            <span>Pornește descărcarea MP3 automat când lipesc un link</span>
          </label>
        </div>
      </form>
    </section>

    <!-- Card Stare Activa (Previzualizare / Progres / Finalizat) -->
    <section id="statusCard" class="card hidden" aria-live="polite"></section>

    <!-- Rezultate Cautare YouTube -->
    <section id="resultsSection" class="hidden">
      <div class="section-header-row">
        <h2 id="resultsTitle" class="section-label">Rezultate YouTube</h2>
      </div>
      <div id="resultsList" class="results-list"></div>
    </section>

    <!-- Biblioteca Offline MP3 (IndexedDB pe telefon) -->
    <section>
      <div class="section-header-row">
        <h2 class="section-label">🎵 Melodii MP3 Salvate (<span id="libraryCount">0</span>)</h2>
        <div>
          <input type="file" id="importMp3Input" accept="audio/mpeg,audio/mp3,audio/*" multiple class="hidden">
          <button type="button" id="importMp3Btn" class="btn-icon">➕ Importă MP3</button>
        </div>
      </div>
      <div id="libraryList" class="library-list"></div>
    </section>
  </main>

  <script src="./app.js?v=8"></script>
</body>
</html>
